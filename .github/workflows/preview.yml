name: Per-PR theme preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Preview theme (skips without Shopify token)
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
    steps:
      - name: Check out repository
        if: ${{ env.SHOPIFY_CLI_THEME_TOKEN != '' }}
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: ${{ env.SHOPIFY_CLI_THEME_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Shopify CLI locally
        if: ${{ env.SHOPIFY_CLI_THEME_TOKEN != '' }}
        run: npm install --no-save @shopify/cli
      - name: Push unpublished preview theme
        if: ${{ env.SHOPIFY_CLI_THEME_TOKEN != '' }}
        id: push
        shell: bash
        run: |
          npx shopify theme push \
            --unpublished \
            --json \
            --theme "PR #${{ github.event.number }}" > theme-push.json

          preview_url="$(jq -r '.theme.preview_url // empty' theme-push.json)"
          theme_id="$(jq -r '.theme.id // empty' theme-push.json)"

          if [ -z "$preview_url" ] || [ -z "$theme_id" ]; then
            echo 'Shopify CLI did not return a theme ID and preview URL.' >&2
            exit 1
          fi

          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "theme_id=$theme_id" >> "$GITHUB_OUTPUT"
      - name: Post preview URL on the pull request
        if: ${{ env.SHOPIFY_CLI_THEME_TOKEN != '' }}
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.push.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- shopify-pr-preview -->';
            const body = `${marker}\nShopify theme preview: ${process.env.PREVIEW_URL}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    name: Delete preview theme (skips without Shopify token)
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
    steps:
      - name: Check out repository
        if: ${{ env.SHOPIFY_CLI_THEME_TOKEN != '' }}
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: ${{ env.SHOPIFY_CLI_THEME_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Shopify CLI locally
        if: ${{ env.SHOPIFY_CLI_THEME_TOKEN != '' }}
        run: npm install --no-save @shopify/cli
      - name: Delete unpublished preview theme
        if: ${{ env.SHOPIFY_CLI_THEME_TOKEN != '' }}
        run: npx shopify theme delete --force --theme "PR #${{ github.event.number }}"
